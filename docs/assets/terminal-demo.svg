<svg xmlns="http://www.w3.org/2000/svg" width="720" height="228" viewBox="0 0 720 228" role="img" aria-label="Terminal simulation: the pod in production receives a spot interruption notice, Understudy holds the eviction and starts a stand-in pod that goes from Pending to Running; only then does the original terminate. The probe records 764 requests, 1 failed.">
  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
    }
    .t { fill: rgba(242, 241, 236, 0.88); }
    .dim { fill: rgba(242, 241, 236, 0.55); }
    .ok { fill: #53c287; }
    .warn { fill: #d29284; }
    .bar-title { font-size: 11.5px; letter-spacing: 0.6px; fill: rgba(242, 241, 236, 0.55); }
    .probe-label { fill: rgba(242, 241, 236, 0.7); }
    .probe-strong { fill: #f2f1ec; font-weight: 700; }

    .stage { animation: stage 16s linear infinite both; }
    .cover { animation: cover 16s linear infinite both; }
    .caret { opacity: 0; animation: caretHold 16s linear infinite both; }
    .caret-blink { animation: blink 0.9s step-end infinite; }
    .header { animation: header 16s linear infinite both; }
    .pod-a { opacity: 0.28; animation: podA 16s linear infinite both; }
    .pod-b { animation: podB 16s linear infinite both; }
    .below { animation: below 16s linear infinite both; }
    .event { animation: event 16s linear infinite both; }
    .probe { animation: probe 16s linear infinite both; }
    .sa-run { opacity: 0; animation: saRun 16s linear infinite both; }
    .sa-term { animation: saTerm 16s linear infinite both; }
    .rb-0 { opacity: 0; animation: off45 16s linear infinite both; }
    .rb-1 { animation: on45 16s linear infinite both; }
    .sb-pen { opacity: 0; animation: sbPen 16s linear infinite both; }
    .sb-cc { opacity: 0; animation: sbCc 16s linear infinite both; }
    .sb-run { animation: on45 16s linear infinite both; }
    .ev-1 { opacity: 0; animation: ev1 16s linear infinite both; }
    .ev-2 { opacity: 0; animation: ev2 16s linear infinite both; }
    .ev-3 { opacity: 0; animation: ev3 16s linear infinite both; }
    .ev-4 { animation: ev4 16s linear infinite both; }

    @keyframes stage { 0%, 93.8% { opacity: 1; } 96.9%, 100% { opacity: 0; } }
    @keyframes cover {
      0%, 0.9% { opacity: 1; transform: translateX(0); animation-timing-function: steps(43, end); }
      7.8% { transform: translateX(340px); }
      100% { opacity: 1; transform: translateX(340px); }
    }
    @keyframes caretHold { 0%, 17.8% { opacity: 1; } 19%, 100% { opacity: 0; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes header {
      0%, 7.8% { opacity: 0; transform: translateY(3px); }
      9.2%, 100% { opacity: 1; transform: none; }
    }
    @keyframes podA {
      0%, 9.1% { opacity: 0; transform: translateY(3px); }
      10.5% { opacity: 1; transform: none; }
      65.6% { opacity: 1; transform: none; }
      69.4%, 100% { opacity: 0.28; transform: none; }
    }
    @keyframes podB {
      0%, 26.3% { opacity: 0; transform: translateY(3px); }
      29.1%, 100% { opacity: 1; transform: none; }
    }
    @keyframes below {
      0%, 26.3% { transform: translateY(-24px); }
      29.1%, 100% { transform: none; }
    }
    @keyframes event {
      0%, 15.6% { opacity: 0; transform: translateY(3px); }
      17%, 100% { opacity: 1; transform: none; }
    }
    @keyframes probe {
      0%, 71.9% { opacity: 0; transform: translateY(3px); }
      73.8%, 100% { opacity: 1; transform: none; }
    }
    @keyframes saRun { 0%, 56.3% { opacity: 1; } 57.5%, 100% { opacity: 0; } }
    @keyframes saTerm { 0%, 56.3% { opacity: 0; } 57.5%, 100% { opacity: 1; } }
    @keyframes off45 { 0%, 45% { opacity: 1; } 46.2%, 100% { opacity: 0; } }
    @keyframes on45 { 0%, 45% { opacity: 0; } 46.2%, 100% { opacity: 1; } }
    @keyframes sbPen { 0%, 35.6% { opacity: 1; } 36.8%, 100% { opacity: 0; } }
    @keyframes sbCc {
      0%, 35.6% { opacity: 0; }
      36.8% { opacity: 1; }
      45% { opacity: 1; }
      46.2%, 100% { opacity: 0; }
    }
    @keyframes ev1 { 0%, 24.4% { opacity: 1; } 25.6%, 100% { opacity: 0; } }
    @keyframes ev2 {
      0%, 25% { opacity: 0; }
      26.2% { opacity: 1; }
      50% { opacity: 1; }
      51.2%, 100% { opacity: 0; }
    }
    @keyframes ev3 {
      0%, 50% { opacity: 0; }
      51.2% { opacity: 1; }
      65% { opacity: 1; }
      66.2%, 100% { opacity: 0; }
    }
    @keyframes ev4 { 0%, 65% { opacity: 0; } 66.2%, 100% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .stage, .cover, .caret, .caret-blink, .header, .pod-a, .pod-b, .below,
      .event, .probe, .sa-run, .sa-term, .rb-0, .rb-1, .sb-pen, .sb-cc,
      .sb-run, .ev-1, .ev-2, .ev-3, .ev-4 { animation: none !important; }
      .cover, .caret { opacity: 0; }
      .below { transform: none; }
    }
  </style>

  <rect x="0.5" y="0.5" width="719" height="227" rx="10" fill="#090d0b" stroke="rgba(242, 241, 236, 0.14)"/>
  <line x1="1" y1="36" x2="719" y2="36" stroke="rgba(242, 241, 236, 0.1)"/>
  <rect x="16" y="15" width="8" height="8" fill="#53c287"/>
  <text class="bar-title" x="34" y="24">production - eks / karpenter / spot</text>

  <g class="stage">
    <text class="t" x="24" y="72" textLength="336">$ kubectl get pods -w -l app=tenant-worker</text>
    <g class="cover">
      <rect x="24" y="57" width="346" height="20" fill="#090d0b"/>
      <g class="caret">
        <rect class="caret-blink" x="24" y="59" width="5.5" height="15" fill="#53c287"/>
      </g>
    </g>

    <g class="header">
      <text class="t" x="24" y="96">NAME</text>
      <text class="t" x="272" y="96">READY</text>
      <text class="t" x="336" y="96">STATUS</text>
    </g>

    <g class="pod-a">
      <text class="t" x="24" y="120">tenant-worker-6d8f7c-x2k4q</text>
      <text class="t" x="272" y="120">1/1</text>
      <text class="ok sa-run" x="336" y="120">Running</text>
      <text class="warn sa-term" x="336" y="120">Terminating</text>
    </g>

    <g class="pod-b">
      <text class="t" x="24" y="144">tenant-worker-6d8f7c-p9d2m</text>
      <text class="dim rb-0" x="272" y="144">0/1</text>
      <text class="t rb-1" x="272" y="144">1/1</text>
      <text class="dim sb-pen" x="336" y="144">Pending</text>
      <text class="dim sb-cc" x="336" y="144">ContainerCreating</text>
      <text class="ok sb-run" x="336" y="144">Running</text>
    </g>

    <g class="below">
      <g class="event">
        <text class="warn ev-1" x="24" y="178">! spot interruption: node spot-arm64-a7f3 (2m)</text>
        <text class="ok ev-2" x="24" y="178">understudy: holding eviction, starting stand-in</text>
        <text class="ok ev-3" x="24" y="178">understudy: stand-in ready, releasing original</text>
        <text class="dim ev-4" x="24" y="178">understudy: standing down</text>
      </g>
      <text class="probe probe-label" x="24" y="206">probe: <tspan class="probe-strong">764 requests, 1 failed</tspan></text>
    </g>
  </g>
</svg>
