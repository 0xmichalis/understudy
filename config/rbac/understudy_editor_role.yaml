# This rule is not used by the project understudy itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the apps.understudy.sh.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: understudy
    app.kubernetes.io/managed-by: kustomize
  name: understudy-editor-role
rules:
- apiGroups:
  - apps.understudy.sh
  resources:
  - understudies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.understudy.sh
  resources:
  - understudies/status
  verbs:
  - get
