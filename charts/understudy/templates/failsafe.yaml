{{- if .Values.failsafe.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "understudy.fullname" . }}-failsafe
  labels:
    {{- include "understudy.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "understudy.fullname" . }}-failsafe
  labels:
    {{- include "understudy.labels" . | nindent 4 }}
rules:
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "understudy.fullname" . }}-failsafe
  labels:
    {{- include "understudy.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "understudy.fullname" . }}-failsafe
subjects:
  - kind: ServiceAccount
    name: {{ include "understudy.fullname" . }}-failsafe
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "understudy.fullname" . }}-failsafe
  labels:
    {{- include "understudy.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.failsafe.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "understudy.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: failsafe
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "understudy.fullname" . }}-failsafe
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: janitor
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/sentinel"]
              args:
                - --mode=janitor
                - --stale-after={{ .Values.failsafe.staleAfter }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.failsafe.resources | nindent 16 }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
