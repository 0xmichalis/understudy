apiVersion: v2
name: understudy
description: >-
  Best-effort high availability for single-replica Kubernetes workloads: no
  downtime from announced node disruptions (drains, upgrades, consolidation,
  spot reclaims) without a standing second replica.
type: application
version: 0.4.4
appVersion: "0.4.4"
kubeVersion: ">=1.34.0-0"
keywords:
  - availability
  - spot
  - eviction
  - admission-webhook
  - node-drain
  - karpenter
  - cluster-autoscaler
  - argo-rollouts
  - gitops
home: https://github.com/kylan11/understudy
sources:
  - https://github.com/kylan11/understudy
icon: https://raw.githubusercontent.com/kylan11/understudy/main/docs/assets/understudy-badge.png
maintainers:
  - name: kylan11
    url: https://github.com/kylan11
annotations:
  artifacthub.io/category: skip-prediction
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: Seamless Upgrades
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/kylan11/understudy
    - name: How it works
      url: https://github.com/kylan11/understudy/blob/main/docs/how-it-works.md
    - name: Upgrade notes
      url: https://github.com/kylan11/understudy/blob/main/UPGRADING.md
    - name: Issues
      url: https://github.com/kylan11/understudy/issues
  artifacthub.io/images: |
    - name: understudy
      image: ghcr.io/kylan11/understudy:0.4.4
  artifacthub.io/crds: |
    - kind: Understudy
      version: v1alpha1
      name: understudies.apps.understudy.sh
      displayName: Understudy
      description: >-
        Protects a single-replica Deployment or Argo Rollout by bringing up a
        stand-in pod when its node is doomed and holding the eviction until
        the stand-in serves traffic.
  artifacthub.io/crdsExamples: |
    - apiVersion: apps.understudy.sh/v1alpha1
      kind: Understudy
      metadata:
        name: tenant-worker
      spec:
        targetRef:
          kind: Deployment
          name: tenant-worker
        holdMode: always
        minSurgeTimeSeconds: 60
        readinessDeadlineSeconds: 600
  artifacthub.io/changes: |
    - kind: added
      description: Optional baselineReplicas separates Git-owned desired capacity from effective Deployment and Rollout replicas, deferring capacity changes until handover completes
    - kind: added
      description: BaselineApplied status and documented Argo CD field delegation expose and preserve pending capacity changes
    - kind: fixed
      description: Detect Deployment releases during an active surge and apply the latest baseline when application releases take over
